<text x="777.5" y="503" text-anchor="middle" font-size="18" fill="#111">When a grade, mapping or weight changes, signals → POCalculatorService recalculates only the affected students</text>
<text x="777.5" y="535" text-anchor="middle" font-size="18" fill="#111">Grade → LO → PO:  score = Σ(weight × score) ÷ Σ weight   →   StudentPOSnapshot (student × PO; NULL if no data)</text>
