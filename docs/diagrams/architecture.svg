<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">Waffle 5.1 — Sistem Mimarisi</text>

  <!-- Tarayıcı -->
  <rect x="30" y="250" width="230" height="260" rx="12" fill="#eef4ff" stroke="#2f5fb3" stroke-width="2.5"/>
  <text x="145" y="288" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d3f7a">Tarayıcı</text>
  <text x="145" y="318" text-anchor="middle" font-size="17" fill="#333">(HTML / Django admin)</text>
  <g font-size="19" fill="#111">
    <text x="60" y="366">• Admin</text>
    <text x="60" y="400">• Bölüm Başkanı</text>
    <text x="60" y="434">• Öğretim Üyesi</text>
    <text x="60" y="468">• Öğrenci</text>
  </g>

  <!-- Django -->
  <rect x="400" y="90" width="430" height="620" rx="14" fill="#f0f9f1" stroke="#2c7a3d" stroke-width="2.5"/>
  <text x="615" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d5a2b">Django uygulama sunucusu</text>
  <text x="615" y="158" text-anchor="middle" font-size="17" fill="#333">Python 3 · Django 4.2 · WSGI</text>

  <rect x="430" y="185" width="370" height="90" rx="8" fill="#fff" stroke="#2c7a3d" stroke-width="1.8"/>
  <text x="615" y="220" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">config/</text>
  <text x="615" y="250" text-anchor="middle" font-size="17" fill="#333">settings · urls · ortam değişkenleri</text>

  <rect x="430" y="300" width="370" height="385" rx="8" fill="#fff" stroke="#2c7a3d" stroke-width="1.8"/>
  <text x="615" y="335" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">outcomes/ (app)</text>

  <rect x="455" y="355" width="320" height="80" rx="6" fill="#e3f3e6" stroke="#2c7a3d" stroke-width="1.4"/>
  <text x="615" y="388" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Admin paneli / View'lar</text>
  <text x="615" y="415" text-anchor="middle" font-size="16" fill="#333">kimlik doğrulama + rol kontrolü</text>

  <rect x="455" y="460" width="320" height="95" rx="6" fill="#e3f3e6" stroke="#2c7a3d" stroke-width="1.4"/>
  <text x="615" y="493" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">POCalculatorService</text>
  <text x="615" y="519" text-anchor="middle" font-size="16" fill="#333">Not → LO → PO, transaction.atomic</text>
  <text x="615" y="541" text-anchor="middle" font-size="16" fill="#333">puan = Σ(ağırlık × puan) ÷ Σ ağırlık</text>

  <rect x="455" y="580" width="320" height="85" rx="6" fill="#e3f3e6" stroke="#2c7a3d" stroke-width="1.4"/>
  <text x="615" y="613" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Modeller (Django ORM)</text>
  <text x="615" y="640" text-anchor="middle" font-size="16" fill="#333">User, Course, LO, PO, Grade, Snapshot</text>

  <line x1="615" y1="435" x2="615" y2="458" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="615" y1="555" x2="615" y2="578" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Dış servisler -->
  <rect x="970" y="90" width="280" height="150" rx="12" fill="#fff5e6" stroke="#b36b00" stroke-width="2.5"/>
  <text x="1110" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a4a00">PostgreSQL</text>
  <text x="1110" y="156" text-anchor="middle" font-size="16" fill="#333">normalize OLTP tabloları</text>
  <text x="1110" y="180" text-anchor="middle" font-size="16" fill="#333">+ StudentPOSnapshot</text>
  <text x="1110" y="216" text-anchor="middle" font-size="15" font-style="italic" fill="#555">POSTGRES_DB yoksa SQLite</text>

  <rect x="970" y="265" width="280" height="125" rx="12" fill="#fdecec" stroke="#b33a3a" stroke-width="2.5"/>
  <text x="1110" y="301" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a1f1f">Redis cache</text>
  <text x="1110" y="331" text-anchor="middle" font-size="16" fill="#333">rapor / ortalama sorguları</text>
  <text x="1110" y="366" text-anchor="middle" font-size="15" font-style="italic" fill="#555">REDIS_URL yoksa bellek cache'i</text>

  <rect x="970" y="415" width="280" height="125" rx="12" fill="#f3ecfb" stroke="#6b3fa0" stroke-width="2.5"/>
  <text x="1110" y="451" text-anchor="middle" font-size="22" font-weight="bold" fill="#47276e">SMTP e-posta</text>
  <text x="1110" y="481" text-anchor="middle" font-size="16" fill="#333">bildirim ve risk uyarıları</text>
  <text x="1110" y="516" text-anchor="middle" font-size="15" font-style="italic" fill="#555">EMAIL_HOST yoksa konsol</text>

  <rect x="970" y="565" width="280" height="145" rx="12" fill="#eef1f4" stroke="#4a5866" stroke-width="2.5"/>
  <text x="1110" y="601" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a3540">Dosya depolama</text>
  <text x="1110" y="631" text-anchor="middle" font-size="16" fill="#333">MEDIA_ROOT (media/)</text>
  <text x="1110" y="657" text-anchor="middle" font-size="16" fill="#333">Excel/CSV not dosyaları</text>
  <text x="1110" y="681" text-anchor="middle" font-size="16" fill="#333">syllabus PDF'leri</text>

  <!-- Oklar -->
  <g stroke="#333" stroke-width="2.2" fill="none">
    <line x1="260" y1="360" x2="398" y2="360" marker-end="url(#arr)"/>
    <line x1="400" y1="410" x2="262" y2="410" marker-end="url(#arr)"/>
    <line x1="830" y1="165" x2="968" y2="165" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <line x1="830" y1="328" x2="968" y2="328" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <line x1="830" y1="478" x2="968" y2="478" marker-end="url(#arr)"/>
    <line x1="830" y1="638" x2="968" y2="638" marker-end="url(#arr)" marker-start="url(#arr)"/>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="329" y="350">HTTP(S) isteği</text>
    <text x="329" y="434">HTML yanıtı</text>
    <text x="899" y="155">SQL (ORM)</text>
    <text x="899" y="318">get / set</text>
    <text x="899" y="468">SMTP</text>
    <text x="899" y="628">oku / yaz</text>
  </g>
</svg>
